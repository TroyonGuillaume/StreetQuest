<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetQuest</title>

  <!-- CSS de Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* Utilisation de dvh pour s'adapter à la barre d'outils mobile */
    html, body {
      margin: 0; padding: 0;
      height: 100dvh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
    }

    header {
      background-color: #4a90e2; color: white;
      padding: 10px; text-align: center;
      flex-shrink: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    .mission-banner {
      background-color: #ffeaa7;
      color: #d63031;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    #map {
      flex-grow: 1;
      width: 100%;
      z-index: 1;
      min-height: 0;
    }

    .controls {
      padding: 15px;
      background: white;
      text-align: center;
      border-top: 3px solid #4a90e2;
      flex-shrink: 0;
      /* Utilisation standard pour gérer la barre de navigation iPhone */
      padding-bottom: env(safe-area-inset-bottom);
    }

    button {
      background-color: #2ecc71;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(46, 204, 113, 0.4);
      width: 100%;
      max-width: 320px;
    }

    button:active {
      transform: scale(0.95);
    }

    .leaflet-popup-content {
      font-size: 1.1rem;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <h1>🚀 StreetQuest</h1>
</header>

<div class="mission-banner" id="banner-text">
  Appuie sur le bouton pour te repérer !
</div>

<div id="map"></div>

<div class="controls">
  <button id="btn-gps">📍 Trouver ma position</button>
</div>

<!-- JS de Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1. Initialisation de la carte
  const map = L.map('map').setView([50.1732, 3.2327], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 2. Éléments de l'interface
  const btn = document.getElementById('btn-gps');
  const banner = document.getElementById('banner-text');
  let monMarqueur = null;

  // 3. Action au clic
  btn.addEventListener('click', () => {
    btn.innerText = "🔍 Recherche...";
    banner.innerText = "Je cherche ta position...";

    navigator.geolocation.getCurrentPosition((position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      map.setView([lat, lon], 17);

      if (monMarqueur) map.removeLayer(monMarqueur);

      monMarqueur = L.marker([lat, lon]).addTo(map)
              .bindPopup('🎉 Bravo ! Tu es ici !')
              .openPopup();

      btn.innerText = "📍 Position trouvée !";
      banner.innerText = "🌟 Mission accomplie !";

      setTimeout(() => { btn.innerText = "📍 Actualiser"; }, 2000);
    }, () => {
      alert("Impossible d'accéder à la position!");
      btn.innerText = "📍 Réessayer";
    });
  });
</script>
</body>
</html>
