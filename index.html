<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetQuest Cambrai</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- VUE 1 : MENU (HOME) -->
<div id="home-view" class="view active">
  <header><h1>🚀 StreetQuest</h1></header>
  <div style="padding: 20px;">
    <h2>Choisis ta chasse :</h2>
    <div id="hunt-list"></div>
  </div>
</div>

<!-- VUE 2 : JEU -->
<div id="game-view" class="view">
  <header>
    <button class="back-btn" onclick="showHome()">⬅️</button>
    <h1>StreetQuest</h1>
  </header>
  <div class="mission-banner" id="banner-text">Trouve le trésor !</div>
  <div id="map"></div>

  <div id="quiz-overlay">
    <h2 id="q-title">Énigme trouvée !</h2>
    <p id="q-text"></p>
    <input type="text" id="q-answer" placeholder="Ta réponse...">
    <button id="btn-submit" style="margin-top:20px;">Valider</button>
  </div>

  <div class="controls"><button id="btn-gps">📍 Vérifier ma position</button></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
